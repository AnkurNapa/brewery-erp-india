<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brewhouse ERP</title>
<meta name="description" content="A free browser ERP for Indian microbreweries and brewpubs: raw materials, recipes, batches, excise register, VAT and GST invoices.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe3;--card:#fffaf2;--ink:#2a1a10;--muted:#7a6553;--line:#e3d5c0;
  --stout:#24160d;--foam:#f6efe3;--amber:#c7741c;--amber-soft:#f6e1bf;
  --hop:#4f7a28;--hop-soft:#e1ecd2;--red:#b3361f;--red-soft:#f6d8cf;
  --radius:10px;--shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(42,26,16,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;letter-spacing:-.3px;margin:0}
.mono,td.n,th.n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13.5px}
header{background:var(--stout);color:var(--foam);padding:18px 24px 12px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-weight:800;font-size:26px}
header h1 span{color:var(--amber)}
header small{color:#c9b59c}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--stout);padding:0 16px;border-bottom:4px solid var(--amber)}
nav button{background:none;border:0;color:#c9b59c;padding:10px 14px;font:500 14px/1 "IBM Plex Sans",sans-serif;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;transition:color .15s,background-color .15s}
nav button:hover{color:var(--foam)}
nav button[aria-current]{background:var(--amber);color:var(--stout)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:32px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi b{display:block;font:800 30px/1.1 "Fraunces",serif}
.kpi span{color:var(--muted);font-size:13px}
.kpi.hero{background:var(--stout);color:var(--foam)}
.kpi.hero b{font-size:46px;color:var(--amber)}
.kpi.hero span{color:#c9b59c}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;overflow-x:auto}
.panel h3{font-size:19px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--amber-soft);color:#7a4510}
.pill.ok{background:var(--hop-soft);color:var(--hop)}
.pill.low{background:var(--red-soft);color:var(--red)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--amber)}
button{font:inherit;cursor:pointer}
.primary{background:var(--amber);color:var(--stout);border:0;padding:10px 16px;border-radius:8px;font-weight:600;transition:transform .1s,background-color .15s}
.primary:hover{background:#d8862c}
.primary:active{transform:translateY(1px)}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:8px}
.ghost:hover{border-color:var(--amber)}
.link{background:none;border:0;color:var(--amber);font-weight:600;padding:2px 4px}
.link.del{color:var(--red)}
.link:hover{text-decoration:underline}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
td select{width:auto;padding:4px 8px}
dialog{border:0;border-radius:14px;padding:0;max-width:720px;width:calc(100% - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(36,22,13,.55)}
.sheet{padding:22px}
.sheet h2{font-size:24px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.wide{grid-column:1/-1}
.lines{margin-top:16px}
.lines td{padding:4px}
.x{background:none;border:0;color:var(--red);font-size:20px;line-height:1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.empty{color:var(--muted);padding:12px 0}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--stout);color:var(--foam);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tank{margin:0;border-top:4px solid var(--amber)}
.tank-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px}
.tank-top small{color:var(--muted)}
.curve{width:100%;height:70px;background:linear-gradient(var(--amber-soft),transparent);border-radius:6px;margin:6px 0}
.readings{display:flex;gap:18px;margin:6px 0 12px}
.readings span{font-size:12px;color:var(--muted)}
.readings b{display:block;font:500 18px "IBM Plex Mono",monospace;color:var(--ink)}
#print{display:none}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpi.hero{grid-column:1/-1}.cols{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.head h2{font-size:26px}}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:13px}
  #print table{margin:14px 0}
  #print .inv-head{display:flex;justify-content:space-between;border-bottom:3px solid #000;padding-bottom:10px}
}
</style>
</head>
<body>
<header><h1>Brew<span>house</span> ERP</h1><small id="brand"></small></header>
<nav id="nav" aria-label="Main navigation"></nav>
<main id="main"></main>
<dialog id="modal"></dialog>
<div id="print"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'brewhouse-erp-v1';
const STATUSES = ['Brewing', 'Fermenting', 'Conditioning', 'Ready', 'Sold out'];
const IN_TANK = ['Brewing', 'Fermenting', 'Conditioning'];
const VIEWS = { dash: 'Dashboard', tanks: 'Tanks', batches: 'Batches', materials: 'Raw materials', recipes: 'Recipes', menu: 'Menu', sales: 'Sales', tax: 'Excise & tax', settings: 'Settings' };

const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const daysAgo = d => new Date(Date.now() - d * 864e5).toISOString().slice(0, 10);
const inr = n => '₹' + (+n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (n, d = 1) => (+n || 0).toLocaleString('en-IN', { maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const abv = (og, fg) => (og - fg) * 131.25;
const $ = id => document.getElementById(id);

let db = load();
const mat = id => db.materials.find(m => m.id === id);
const rec = id => db.recipes.find(r => r.id === id);
const prod = id => db.products.find(p => p.id === id);
const tank = id => db.tanks.find(t => t.id === id);

function demo() {
  const m = (name, type, unit, qty, reorder, cost) => ({ id: uid(), name, type, unit, qty, reorder, cost });
  const mats = [
    m('Pale malt', 'Malt', 'kg', 420, 150, 65), m('Wheat malt', 'Malt', 'kg', 120, 50, 80),
    m('Munich malt', 'Malt', 'kg', 80, 40, 90), m('Crystal 60', 'Malt', 'kg', 25, 20, 110),
    m('Cascade', 'Hops', 'kg', 6, 5, 3200), m('Citra', 'Hops', 'kg', 2, 3, 5200), m('Saaz', 'Hops', 'kg', 4, 2, 2800),
    m('US-05', 'Yeast', 'pack', 30, 10, 450), m('WB-06', 'Yeast', 'pack', 12, 10, 480), m('W-34/70', 'Yeast', 'pack', 8, 10, 520),
    m('CO2', 'Gas', 'kg', 60, 20, 40),
  ];
  const byName = n => mats.find(x => x.name === n).id;
  const r = (name, style, size, og, fg, items) => ({ id: uid(), name, style, size, og, fg, items: items.map(([n, qty]) => ({ id: byName(n), qty })) });
  const recs = [
    r('Indiranagar IPA', 'American IPA', 500, 1.062, 1.012, [['Pale malt', 110], ['Crystal 60', 6], ['Cascade', 2.5], ['Citra', 1.5], ['US-05', 6]]),
    r('Monsoon Wit', 'Witbier', 500, 1.048, 1.010, [['Pale malt', 50], ['Wheat malt', 50], ['Saaz', 1], ['WB-06', 6]]),
    r('Helles Lager', 'Munich Helles', 500, 1.050, 1.010, [['Pale malt', 90], ['Munich malt', 20], ['Saaz', 2], ['W-34/70', 8]]),
  ];
  const [ipa, wit, lager] = recs;
  const tanks = ['FV-1', 'FV-2', 'FV-3', 'FV-4', 'BBT-1', 'BBT-2'].map(name => ({ id: uid(), name, type: name.startsWith('FV') ? 'Fermenter' : 'Brite tank', capacity: 500 }));
  const T = n => tanks.find(t => t.name === n).id;
  const curve = (start, og, fg, days, temp) => Array.from({ length: days }, (_, i) => ({ date: daysAgo(start - i), gravity: +(fg + (og - fg) * Math.exp(-i / 2.2)).toFixed(3), temp, ph: '', note: '' }));
  const b = (code, recipe, date, status, volume, og, fg, readyDate, tankId, log = []) => ({ id: uid(), code, recipeId: recipe.id, date, status, volume, og, fg, notes: '', readyDate, dutyRate: readyDate ? 50 : undefined, tankId, log });
  const p = (name, kind, recipe, ml, price) => ({ id: uid(), name, kind, recipeId: recipe?.id || '', ml, price });
  const prods = [
    p('IPA pint 330 ml', 'beer', ipa, 330, 350), p('IPA 500 ml', 'beer', ipa, 500, 450), p('IPA growler 2 L', 'beer', ipa, 2000, 1600),
    p('Wit pint 330 ml', 'beer', wit, 330, 320), p('Helles pint 330 ml', 'beer', lager, 330, 300),
    p('Peri peri fries', 'food', null, 0, 280), p('Chicken wings', 'food', null, 0, 420),
  ];
  const line = (pr, qty) => ({ pid: pr.id, name: pr.name, kind: pr.kind, qty, price: pr.price });
  return {
    settings: { name: 'Hoppy Monk Brewpub', gstin: '29ABCDE1234F1Z5', address: '12, 100 Feet Road, Indiranagar, Bengaluru 560038', state: 'Karnataka', exciseRate: 50, vat: 10, foodGst: 5, prefix: 'HM' },
    seq: { batch: 5, inv: 3 },
    materials: mats, recipes: recs, products: prods, tanks,
    batches: [
      b('B-001', ipa, daysAgo(24), 'Ready', 480, 1.063, 1.012, daysAgo(4), T('BBT-1')),
      b('B-002', wit, daysAgo(16), 'Ready', 470, 1.048, 1.011, daysAgo(2), T('BBT-2')),
      b('B-003', lager, daysAgo(9), 'Conditioning', 490, 1.051, 1.010, undefined, T('FV-2'), curve(9, 1.051, 1.010, 10, 11)),
      b('B-004', ipa, daysAgo(2), 'Fermenting', 500, 1.061, 1.040, undefined, T('FV-1'), curve(2, 1.061, 1.012, 3, 19)),
    ],
    sales: [
      { id: uid(), no: 'HM-0001', date: daysAgo(1), customer: 'Walk-in', gstin: '', vat: 10, gst: 5, lines: [line(prods[0], 6), line(prods[3], 4), line(prods[5], 2)] },
      { id: uid(), no: 'HM-0002', date: today(), customer: 'Koramangala Social', gstin: '29AAACK1234L1Z2', vat: 10, gst: 5, lines: [line(prods[2], 5), line(prods[6], 3)] },
    ],
  };
}

function load() {
  try { const s = localStorage.getItem(KEY); if (s) return migrate(JSON.parse(s)); } catch (e) { /* storage blocked: fall back to demo */ }
  return demo();
}
function migrate(d) {
  d.tanks ||= [];
  for (const b of d.batches) b.log ||= [];
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('This browser blocked saving. Export a backup from Settings.'); }
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- calculations ----------
function calc(s) {
  let beer = 0, food = 0;
  for (const l of s.lines) { const amt = l.qty * l.price; if (l.kind === 'food') food += amt; else beer += amt; }
  const vat = beer * s.vat / 100, cgst = food * s.gst / 200;
  return { beer, food, vat, cgst, sgst: cgst, total: beer + food + vat + 2 * cgst };
}
function beerStock() {
  return db.recipes.map(r => {
    const produced = db.batches.filter(b => b.recipeId === r.id && b.readyDate).reduce((a, b) => a + +b.volume, 0);
    const sold = db.sales.flatMap(s => s.lines).reduce((a, l) => { const p = prod(l.pid); return p && p.recipeId === r.id ? a + l.qty * p.ml / 1000 : a; }, 0);
    return { r, produced, sold, left: produced - sold };
  });
}
const recipeCost = r => r.items.reduce((a, i) => a + i.qty * (mat(i.id)?.cost || 0), 0);
const duty = b => b.readyDate ? b.volume * (b.dutyRate || 0) : 0;

// ---------- views ----------
function head(title, sub, btn = '') { return `<div class="head"><div><h2>${title}</h2><p>${sub}</p></div>${btn}</div>`; }
function table(cols, rows, foot = '') {
  if (!rows.length) return '<p class="empty">Nothing here yet.</p>';
  return `<table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>${foot}</table>`;
}
const pill = (txt, cls = '') => `<span class="pill ${cls}">${esc(txt)}</span>`;
const statusCls = s => s === 'Ready' ? 'ok' : s === 'Sold out' ? 'low' : '';

function chart(b) {
  const pts = [{ gravity: b.og }, ...b.log].map(r => +r.gravity).filter(Boolean);
  if (pts.length < 2) return '<p class="note">Log a few gravity readings to see the curve.</p>';
  const hi = Math.max(...pts), lo = Math.min(...pts), span = hi - lo || 0.001, W = 300, H = 70;
  const xy = pts.map((g, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${(6 + (hi - g) / span * (H - 12)).toFixed(1)}`).join(' ');
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gravity from ${hi.toFixed(3)} to ${pts.at(-1).toFixed(3)}"><polyline points="${xy}" fill="none" stroke="var(--amber)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

const render = {
  dash() {
    const stock = beerStock(), month = today().slice(0, 7);
    const left = stock.reduce((a, s) => a + Math.max(0, s.left), 0);
    const inTank = db.batches.filter(b => IN_TANK.includes(b.status));
    const salesM = db.sales.filter(s => s.date.startsWith(month)).reduce((a, s) => a + calc(s).total, 0);
    const dutyM = db.batches.filter(b => b.readyDate?.startsWith(month)).reduce((a, b) => a + duty(b), 0);
    const low = db.materials.filter(m => +m.qty <= +m.reorder);
    const max = Math.max(1, ...stock.map(s => s.produced));
    return head('Today at the brewhouse', `${esc(db.settings.name)} · ${new Date().toLocaleDateString('en-IN', { dateStyle: 'full' })}`, `<button class="primary" data-act="newBatch">+ New batch</button>`) + `
      <div class="kpis">
        <div class="kpi hero"><b>${num(left, 0)} L</b><span>Beer ready to serve</span></div>
        <div class="kpi"><b>${inTank.length}</b><span>Batches in tanks</span></div>
        <div class="kpi"><b>${inr(salesM).replace(/\.\d+$/, '')}</b><span>Sales this month</span></div>
        <div class="kpi"><b>${inr(dutyM).replace(/\.\d+$/, '')}</b><span>Excise this month</span></div>
        <div class="kpi"><b style="color:${low.length ? 'var(--red)' : 'var(--hop)'}">${low.length}</b><span>Materials to reorder</span></div>
      </div>
      <div class="cols">
        <div class="panel"><h3>Beer on hand</h3>${table([{ t: 'Beer' }, { t: 'Level' }, { t: 'Litres left', n: 1 }],
          stock.map(s => `<tr><td>${esc(s.r.name)}</td><td><div class="bar"><i style="width:${Math.max(0, s.left) / max * 100}%"></i></div></td><td class="n">${num(s.left)}</td></tr>`))}</div>
        <div class="panel"><h3>Reorder now</h3>${low.length ? table([{ t: 'Material' }, { t: 'On hand', n: 1 }, { t: 'Reorder at', n: 1 }],
          low.map(m => `<tr><td>${esc(m.name)}</td><td class="n">${num(m.qty, 2)} ${esc(m.unit)}</td><td class="n">${num(m.reorder, 2)}</td></tr>`)) : '<p class="empty">Stores are healthy.</p>'}</div>
      </div>
      <div class="panel"><h3>In the tanks</h3>${table([{ t: 'Batch' }, { t: 'Beer' }, { t: 'Brewed' }, { t: 'Status' }, { t: 'Volume', n: 1 }],
        inTank.map(b => `<tr><td class="mono">${esc(b.code)}</td><td>${esc(rec(b.recipeId)?.name)}</td><td>${b.date}</td><td>${pill(b.status)}</td><td class="n">${num(b.volume)} L</td></tr>`))}</div>`;
  },

  tanks() {
    const cards = db.tanks.map(t => {
      const b = db.batches.find(x => x.tankId === t.id && x.status !== 'Sold out');
      const last = b?.log.at(-1);
      return `<div class="panel tank"><div class="tank-top"><div><h3>${esc(t.name)}</h3><small>${esc(t.type)} · ${num(t.capacity)} L</small></div>
        ${b ? pill(b.status, statusCls(b.status)) : pill('Empty', 'ok')}</div>
        ${b ? `<p><b class="mono">${esc(b.code)}</b> ${esc(rec(b.recipeId)?.name)} · ${num(b.volume)} L · ${num(b.volume / (t.capacity || 1) * 100, 0)}% full</p>
          ${chart(b)}
          <div class="readings"><span><b>${last ? (+last.gravity).toFixed(3) : (+b.fg).toFixed(3)}</b>gravity</span><span><b>${last?.temp !== '' && last?.temp != null ? num(last.temp) + '°C' : 'n/a'}</b>temp</span><span><b>${num(abv(b.og, last?.gravity || b.fg))}%</b>ABV so far</span></div>
          <button class="ghost" data-act="logReading" data-id="${b.id}">+ Log reading</button>` : '<p class="empty">Ready for the next brew.</p>'}
        <button class="link" data-act="editTank" data-id="${t.id}">Edit</button><button class="link del" data-act="delTank" data-id="${t.id}">Delete</button></div>`;
    });
    return head('Tanks', 'Every fermenter and brite tank, with the batch inside and its gravity curve.', `<button class="primary" data-act="newTank">+ Add tank</button>`)
      + (cards.length ? `<div class="tanks">${cards.join('')}</div>` : '<p class="empty">Add your fermenters and brite tanks to start logging.</p>');
  },

  batches() {
    const rows = [...db.batches].reverse().map(b => {
      const r = rec(b.recipeId);
      return `<tr><td class="mono">${esc(b.code)}</td><td>${esc(r?.name)}</td><td>${esc(tank(b.tankId)?.name || '')}</td><td>${b.date}</td>
        <td><select data-status="${b.id}" aria-label="Status of ${esc(b.code)}">${STATUSES.map(s => `<option ${s === b.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
        <td class="n">${num(b.volume)} L</td><td class="n">${(+b.og).toFixed(3)} / ${(+b.fg).toFixed(3)}</td><td class="n">${num(abv(b.og, b.fg))}%</td>
        <td><button class="link" data-act="editBatch" data-id="${b.id}">Edit</button><button class="link del" data-act="delBatch" data-id="${b.id}">Delete</button></td></tr>`;
    });
    return head('Brew batches', 'Starting a batch takes its ingredients out of stores. Marking it Ready books it in the excise register.', `<button class="primary" data-act="newBatch">+ New batch</button>`)
      + `<div class="panel">${table([{ t: 'Batch' }, { t: 'Beer' }, { t: 'Tank' }, { t: 'Brewed' }, { t: 'Status' }, { t: 'Volume', n: 1 }, { t: 'OG / FG', n: 1 }, { t: 'ABV', n: 1 }, { t: '' }], rows)}</div>`;
  },

  materials() {
    const value = db.materials.reduce((a, m) => a + m.qty * m.cost, 0);
    const rows = db.materials.map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td><td class="n">${num(m.qty, 2)} ${esc(m.unit)}</td><td class="n">${num(m.reorder, 2)}</td>

  sales() {
    const rows = [...db.sales].reverse().map(s => {
      const c = calc(s);
      return `<tr><td class="mono">${esc(s.no)}</td><td>${s.date}</td><td>${esc(s.customer)}</td><td class="n">${inr(c.beer)}</td><td class="n">${inr(c.food)}</td>

    return head('Excise & tax', `Excise is booked at the rate in Settings on the day a batch is marked Ready. State: ${esc(db.settings.state)}.`)
      + `<div class="panel"><h3>Excise register</h3>${table([{ t: 'Batch' }, { t: 'Beer' }, { t: 'Brewed' }, { t: 'Ready' }, { t: 'Bulk litres', n: 1 }, { t: 'ABV', n: 1 }, { t: 'Rate / L', n: 1 }, { t: 'Duty', n: 1 }],
        reg.map(b => `<tr><td class="mono">${esc(b.code)}</td><td>${esc(rec(b.recipeId)?.name)}</td><td>${b.date}</td><td>${b.readyDate}</td><td class="n">${num(b.volume)}</td><td class="n">${num(abv(b.og, b.fg))}%</td><td class="n">${inr(b.dutyRate)}</td><td class="n">${inr(duty(b))}</td></tr>`),
        `<tfoot><tr><td colspan="4">Total</td><td class="n">${num(totL)}</td><td></td><td></td><td class="n">${inr(totD)}</td></tr></tfoot>`)}</div>
      <div class="panel"><h3>Monthly VAT and GST</h3>${table([{ t: 'Month' }, { t: 'Beer sales', n: 1 }, { t: 'VAT', n: 1 }, { t: 'Food sales', n: 1 }, { t: 'CGST', n: 1 }, { t: 'SGST', n: 1 }], mrows)}
      <p class="note">Alcoholic liquor for human consumption sits outside GST. It is taxed through state excise and VAT, so check the rates against your state's current notification.</p></div>`;
  },

  settings() {
    const s = db.settings;
    return head('Settings', 'Your brewery details and tax rates. Data lives in this browser only, so export a backup often.')
      + `<form class="panel" id="settingsForm"><div class="grid">${SETTINGS_FIELDS.map(f => field(f, s[f.k])).join('')}</div>

const SETTINGS_FIELDS = [
  { k: 'name', label: 'Brewery name' }, { k: 'gstin', label: 'GSTIN' },
  { k: 'address', label: 'Address', wide: 1 }, { k: 'state', label: 'State' }, { k: 'prefix', label: 'Invoice prefix' },
  { k: 'exciseRate', label: 'Excise duty (₹ per bulk litre)', type: 'number' }, { k: 'vat', label: 'VAT on beer (%)', type: 'number' },
  { k: 'foodGst', label: 'GST on food (%)', type: 'number' },
];

// ---------- forms ----------
function field(f, v) {
  const name = `name="${f.k}" ${f.req ? 'required' : ''}`;
  const input = f.type === 'select'
    ? `<select ${name}>${f.options.map(o => `<option value="${esc(o.v)}" ${o.v === v ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`
    : `<input ${name} type="${f.type || 'text'}" ${f.type === 'number' ? 'step="any" min="0"' : ''} value="${esc(v ?? '')}">`;
  return `<label class="${f.wide ? 'wide' : ''}">${esc(f.label)}${input}</label>`;
}
function readForm(formEl, fields) {
  const fd = new FormData(formEl), out = {};
  for (const f of fields) out[f.k] = f.type === 'number' ? +fd.get(f.k) || 0 : (fd.get(f.k) || '').trim();
  return out;
}

// lines: { opts:[{id,label}], rows:[{id,qty,price}], price:bool, onPick(id)->price }
function lineRow(L, r = {}) {
  return `<tr><td><select name="l_id">${L.opts.map(o => `<option value="${o.id}" ${o.id === r.id ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></td>
    <td><input name="l_qty" type="number" step="any" min="0" value="${r.qty ?? 1}" aria-label="Quantity"></td>
    ${L.price ? `<td><input name="l_price" type="number" step="any" min="0" value="${r.price ?? L.onPick(r.id || L.opts[0]?.id)}" aria-label="Rate"></td>` : ''}
    <td><button type="button" class="x" data-delline aria-label="Remove line">×</button></td></tr>`;
}

function openForm(title, fields, vals, onSave, L) {
  const m = $('modal');
  m.innerHTML = `<form class="sheet" method="dialog"><h2>${esc(title)}</h2><div class="grid">${fields.map(f => field(f, vals[f.k])).join('')}</div>
    ${L ? `<div class="lines"><table><thead><tr><th>${L.label}</th><th>Qty</th>${L.price ? '<th>Rate ₹</th>' : ''}<th></th></tr></thead><tbody>${(L.rows.length ? L.rows : [{}]).map(r => lineRow(L, r)).join('')}</tbody></table>
    <button type="button" class="ghost" data-addline>+ Add line</button></div>` : ''}
    <div class="actions"><button type="button" class="ghost" data-close>Cancel</button><button class="primary">Save</button></div></form>`;
  const form = m.querySelector('form');
  form.onclick = e => {
    if (e.target.matches('[data-close]')) m.close();
    if (e.target.matches('[data-addline]')) form.querySelector('tbody').insertAdjacentHTML('beforeend', lineRow(L));
    if (e.target.matches('[data-delline]')) e.target.closest('tr').remove();
  };
  form.onchange = e => {
    if (L?.price && e.target.name === 'l_id') e.target.closest('tr').querySelector('[name=l_price]').value = L.onPick(e.target.value);
  };
  form.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(form), ids = fd.getAll('l_id'), qtys = fd.getAll('l_qty'), prices = fd.getAll('l_price');
    const lines = ids.map((id, i) => ({ id, qty: +qtys[i] || 0, price: +prices[i] || 0 })).filter(l => l.qty > 0);
    if (onSave(readForm(form, fields), lines) === false) return;
    m.close(); save(); draw();
  };
  m.showModal();
}

function startBatch(v) {
  const r = rec(v.recipeId), scale = v.volume / (r.size || 1);
  const short = r.items.filter(i => (mat(i.id)?.qty || 0) < i.qty * scale).map(i => mat(i.id)?.name);
  if (short.length && !confirm(`Not enough in stores: ${short.join(', ')}.\nStart the batch anyway? Stock will go negative.`)) return false;
  for (const i of r.items) { const m = mat(i.id); if (m) m.qty = +(m.qty - i.qty * scale).toFixed(3); }
  db.batches.push({ id: uid(), code: 'B-' + String(db.seq.batch++).padStart(3, '0'), status: 'Brewing', log: [], ...v });
  toast('Batch started and ingredients issued from stores');
}

  logReading(id) {
    const b = db.batches.find(x => x.id === id);
    openForm(`Reading for ${b.code}`, READING_FIELDS, { date: today() }, v => {

  newBatch() {
    if (!db.recipes.length) return toast('Add a recipe first');

    openForm('New batch', BATCH_FIELDS(), { recipeId: r.id, date: today(), volume: r.size, og: r.og, fg: r.og }, startBatch);
  },
  editBatch(id) { const b = db.batches.find(x => x.id === id); openForm(`Edit ${b.code}`, BATCH_FIELDS(), b, v => { Object.assign(b, v); }); },

  newMat() { openForm('Add material', MAT_FIELDS, { type: 'Malt', unit: 'kg' }, v => { db.materials.push({ id: uid(), ...v }); }); },
  editMat(id) { const m = mat(id); openForm(`Edit ${m.name}`, MAT_FIELDS, m, v => { Object.assign(m, v); }); },

      <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>
      ${s.lines.map(l => `<tr><td>${esc(l.name)}</td><td class="n">${num(l.qty, 2)}</td><td class="n">${inr(l.price)}</td><td class="n">${inr(l.qty * l.price)}</td></tr>`).join('')}</tbody>
      <tfoot>${c.beer ? `<tr><td colspan="3">Beer subtotal</td><td class="n">${inr(c.beer)}</td></tr><tr><td colspan="3">VAT on beer @ ${s.vat}%</td><td class="n">${inr(c.vat)}</td></tr>` : ''}
      ${c.food ? `<tr><td colspan="3">Food subtotal</td><td class="n">${inr(c.food)}</td></tr><tr><td colspan="3">CGST @ ${s.gst / 2}%</td><td class="n">${inr(c.cgst)}</td></tr><tr><td colspan="3">SGST @ ${s.gst / 2}%</td><td class="n">${inr(c.sgst)}</td></tr>` : ''}

function setStatus(id, status) {
  const b = db.batches.find(x => x.id === id);
  b.status = status;
  if (IN_TANK.includes(status)) { delete b.readyDate; delete b.dutyRate; }
  else if (!b.readyDate) { b.readyDate = today(); b.dutyRate = db.settings.exciseRate; toast(`${b.code} booked in the excise register`); }
  save(); draw();
}

// ---------- shell ----------
function draw() {
  const view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'dash';
  $('brand').textContent = db.settings.name;
  $('nav').innerHTML = Object.entries(VIEWS).map(([k, t]) => `<button data-view="${k}" ${k === view ? 'aria-current="page"' : ''}>${t}</button>`).join('');
  $('main').innerHTML = render[view]();
}

$('nav').onclick = e => { const v = e.target.dataset.view; if (v) location.hash = v; };
$('main').onclick = e => { const b = e.target.closest('[data-act]'); if (b) act[b.dataset.act](b.dataset.id); };
$('main').onchange = e => {
  if (e.target.dataset.status) setStatus(e.target.dataset.status, e.target.value);
  if (e.target.id === 'importFile') {
    e.target.files[0]?.text().then(t => {
      const d = JSON.parse(t);
      if (!d.settings || !Array.isArray(d.batches)) throw new Error('not a backup');
      db = migrate(d); save(); draw(); toast('Backup restored');
    }).catch(() => toast('That file is not a Brewhouse backup'));
  }
};
$('main').onsubmit = e => {
  if (e.target.id !== 'settingsForm') return;
  e.preventDefault();
  Object.assign(db.settings, readForm(e.target, SETTINGS_FIELDS));
  save(); draw(); toast('Settings saved');
};
window.onafterprint = () => { $('print').innerHTML = ''; };
window.onhashchange = draw;
draw();
</script>
</body>
</html>
